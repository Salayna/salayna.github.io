{{- /* Generated banner: dot grid, cropped rings, and a strata rule whose
       bars fade out across the width. Set params.banner to use an image. */ -}}
<svg viewBox="0 0 1200 262" preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Abstract line drawing" focusable="false">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="currentColor" opacity="0.3"/>
    </pattern>
  </defs>

  <g color="var(--ink-3)">
    <rect width="1200" height="262" fill="url(#dots)"/>

    {{/* Concentric rings, cropped by the banner edge. */}}
    <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
      {{ range seq 1 7 }}
        <circle cx="975" cy="131" r="{{ mul . 34 }}"/>
      {{ end }}
    </g>

    {{/* Strata: bar heights cycle, opacity steps down left to right. */}}
    <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      {{ range $i := seq 0 27 }}
        {{ $x := add 56 (mul $i 22) }}
        {{ $h := add 18 (mul (mod (mul $i 7) 9) 12) }}
        <line x1="{{ $x }}" y1="{{ sub 222 $h }}" x2="{{ $x }}" y2="222"
              opacity="{{ math.Max 0.06 (sub 0.5 (mul $i 0.017)) }}"/>
      {{ end }}
    </g>

    <line x1="0" y1="222" x2="1200" y2="222" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  </g>
</svg>
