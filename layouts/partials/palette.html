<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="palette__panel">
    <input class="palette__input" type="text" data-palette-input
           placeholder="Search projects, writing, pages…"
           role="combobox" aria-expanded="true" aria-controls="palette-list"
           aria-autocomplete="list" autocomplete="off" spellcheck="false">
    <ul class="palette__list" id="palette-list" role="listbox" data-palette-list aria-label="Results"></ul>
    <p class="palette__empty" data-palette-empty hidden>Nothing matches that.</p>
    <div class="palette__hint">
      <span>&uarr;&darr; to move</span>
      <span>&crarr; to open</span>
      <span>esc to close</span>
    </div>
  </div>
</div>
