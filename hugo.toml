baseURL = "https://salayna.github.io/"
title = "Salayna"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = false

# Drop the taxonomies we don't use so Hugo doesn't build empty term pages.
disableKinds = ["taxonomy", "term", "rss"]

[params]
  name        = "Salayna"
  role        = "Flutter developer"
  location    = "Lille, France"
  description = "Flutter developer in Lille. I build and ship mobile products end to end."
  email       = "hello@example.com"
  # Shows the "Open to new work" status in the hero.
  available   = true

  # Four short lines for the snapshot card on the home page.
  snapshot = [
    "Shipping Flutter apps.",
    "Designing as I build.",
    "Backend when it's needed.",
    "Allergic to half-done.",
  ]

[[params.social]]
  name = "GitHub"
  url  = "https://github.com/"

[[params.social]]
  name = "LinkedIn"
  url  = "https://linkedin.com/in/"

[[params.social]]
  name = "Email"
  url  = "mailto:hello@example.com"

[menus]
  [[menus.main]]
    name   = "Home"
    url    = "/"
    weight = 1
  [[menus.main]]
    name   = "Work"
    url    = "/work/"
    weight = 2
  [[menus.main]]
    name   = "Writing"
    url    = "/writing/"
    weight = 3

[outputs]
  home = ["html", "json"]

# So a markdown file with no `date` still sorts and displays sensibly:
# fall back to lastmod, then the file's modification time.
[frontmatter]
  date = ["date", "lastmod", ":fileModTime", ":default"]

# A standalone image should be a block, not wrapped in a <p> — otherwise the
# render hook's <figure> ends up nested inside a paragraph, which is invalid.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style     = "github"

[build.buildStats]
  enable = false
